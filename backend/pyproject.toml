[project]
name = "jyxia-institutional-backend"
version = "0.1.0"
description = "Fundacao institucional inicial da JYXIA — Clinical Document Intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "pydantic==2.13.4",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "certifi==2026.10.23",
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]
addopts = "-ra"
