name: Verificacoes de seguranca do prototipo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Criptografia e links de teleconsulta
        run: node --test test_documental.mjs test_security.cjs test_synthetic_import.cjs
      - name: Integracao com identidades sinteticas
        run: python3 -m unittest test_integration.py -v
      - name: Higiene basica da publicacao
        run: python3 check_publication.py
