name: Verificacoes de seguranca, demonstracao e backend institucional
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Nucleo documental, laboratorio, benchmark, PDF.js e testes historicos
        run: node --test tests/frontend/test_documental.mjs tests/frontend/test_documental_pdfjs.mjs tests/frontend/test_lab_and_benchmark.mjs tests/frontend/test_institutional_ui.mjs tests/legacy/test_security.cjs tests/legacy/test_synthetic_import.cjs
      - name: Integracao historica com identidades sinteticas
        run: python3 -m unittest discover -s tests/legacy -v
      - name: Higiene basica da publicacao e coerencia de dependencias
        run: |
          python3 tools/check_publication.py
          python3 tools/sync_backend_deps.py --check

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jyxia
          POSTGRES_PASSWORD: jyxia_ci_ephemeral_pw
          POSTGRES_DB: jyxia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar fonte unica de dependencias, lint Ruff e auditar vulnerabilidades
        run: |
          python3 tools/sync_backend_deps.py --check
          python3 -m venv /tmp/jyxia-ci-venv
          /tmp/jyxia-ci-venv/bin/pip install --no-cache-dir -r backend/requirements-dev.txt
          /tmp/jyxia-ci-venv/bin/ruff check --config backend/pyproject.toml backend tests/backend tools
          /tmp/jyxia-ci-venv/bin/pip-audit
      - name: Inicializar roles restritas jyxia_app e jyxia_worker no PostgreSQL 16 e verificar migracoes Alembic
        env:
          JYXIA_APP_PW: jyxia_ci_app_ephemeral_pw
          JYXIA_WORKER_PW: jyxia_ci_worker_ephemeral_pw
          JYXIA_MIGRATION_DATABASE_URL: postgresql+psycopg://jyxia:jyxia_ci_ephemeral_pw@127.0.0.1:5432/jyxia_test
        run: |
          echo "::add-mask::$JYXIA_APP_PW"
          echo "::add-mask::$JYXIA_WORKER_PW"
          /tmp/jyxia-ci-venv/bin/python -c "
          import os, psycopg
          with psycopg.connect(os.environ['JYXIA_MIGRATION_DATABASE_URL'].replace('+psycopg', ''), autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(\"\"\"
                  DO \$\$
                  BEGIN
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'jyxia_app') THEN
                          CREATE ROLE jyxia_app LOGIN PASSWORD 'jyxia_ci_app_ephemeral_pw'
                              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
                      END IF;
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'jyxia_worker') THEN
                          CREATE ROLE jyxia_worker LOGIN PASSWORD 'jyxia_ci_worker_ephemeral_pw'
                              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
                      END IF;
                  END \$\$;
                  REVOKE CREATE ON SCHEMA public FROM PUBLIC;
                  GRANT USAGE ON SCHEMA public TO jyxia_app;
                  GRANT CONNECT ON DATABASE jyxia_test TO jyxia_app;
                  GRANT USAGE ON SCHEMA public TO jyxia_worker;
                  GRANT CONNECT ON DATABASE jyxia_test TO jyxia_worker;
                  \"\"\")
          "
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini upgrade head
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261122_0009
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261122_0008
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261122_0007
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261122_0006
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261122_0005
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261121_0004
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261120_0003
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261120_0002
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261120_0001
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade base
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini upgrade head
      - name: Iniciar Keycloak 26.8.2 e provisionar realm jyxia-dev + TOTP efemero
        run: |
          KC_PW="CiKcAdmin_$(python3 -c 'import secrets; print(secrets.token_hex(12))')"
          echo "::add-mask::$KC_PW"
          echo "KC_BOOTSTRAP_ADMIN_USERNAME=jyxia_ci_admin" >> "$GITHUB_ENV"
          echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_PW" >> "$GITHUB_ENV"
          docker run -d --name jyxia-keycloak-ci \
            -p 127.0.0.1:8080:8080 \
            -p 127.0.0.1:9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=jyxia_ci_admin \
            -e "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_PW" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HTTP_PORT=8080 \
            -e KC_HOSTNAME_STRICT=false \
            -v "$GITHUB_WORKSPACE/backend/keycloak/jyxia-dev-realm.json:/opt/keycloak/data/import/jyxia-dev-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm
          export KC_BOOTSTRAP_ADMIN_USERNAME=jyxia_ci_admin
          export KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_PW"
          /tmp/jyxia-ci-venv/bin/python tools/ci_setup_keycloak_e2e.py || {
            docker logs jyxia-keycloak-ci | tail -n 80 || true
            exit 1
          }
      - name: Executar suite Pytest completa (PostgreSQL 16 RLS + Keycloak 26.8.2 MFA E2E, zero skips)
        env:
          JYXIA_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://jyxia:jyxia_ci_ephemeral_pw@127.0.0.1:5432/jyxia_test
          JYXIA_TEST_APP_DATABASE_URL: postgresql+psycopg://jyxia_app:jyxia_ci_app_ephemeral_pw@127.0.0.1:5432/jyxia_test
          JYXIA_TEST_WORKER_DATABASE_URL: postgresql+psycopg://jyxia_worker:jyxia_ci_worker_ephemeral_pw@127.0.0.1:5432/jyxia_test
        run: |
          set -o pipefail
          if ! /tmp/jyxia-ci-venv/bin/python -u -m pytest tests/backend -v -rs 2>&1 | tee /tmp/pytest_ci.log; then
            python3 -c "
          from pathlib import Path
          raw_lines = Path('/tmp/pytest_ci.log').read_text(errors='replace').splitlines()
          failed_lines = [l for l in raw_lines if l.startswith(('FAILED ', 'ERROR '))]
          error_lines = [l for l in raw_lines if l.startswith(('E   ', 'psycopg.', 'sqlalchemy.'))]
          priority = failed_lines + error_lines
          if not priority:
              priority = [l for l in raw_lines if 'Error' in l or 'Traceback' in l][-10:]
          for line in priority[:10]:
              print(f'::error::{line}')
          " || true
            docker logs jyxia-keycloak-ci | tail -n 60 || true
            exit 1
          fi
          if grep -E "SKIPPED|[0-9]+ skipped" /tmp/pytest_ci.log; then
            echo "ERROR: Unexpected skipped test in PostgreSQL/Keycloak CI verification."
            exit 1
          fi
      - name: Configurar Node.js 24 e Chrome para E2E institucional headless
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provisionar Chrome headless no runner CI
        uses: browser-actions/setup-chrome@v1
      - name: Executar E2E institucional headless (FastAPI + Worker subprocesso + PostgreSQL 16 RLS + PDF.js via CDP)
        env:
          JYXIA_PYTHON_BIN: /tmp/jyxia-ci-venv/bin/python
          JYXIA_E2E_REQUIRE_POSTGRES: "1"
          JYXIA_DATABASE_URL: postgresql+psycopg://jyxia_app:jyxia_ci_app_ephemeral_pw@127.0.0.1:5432/jyxia_test
          JYXIA_WORKER_DATABASE_URL: postgresql+psycopg://jyxia_worker:jyxia_ci_worker_ephemeral_pw@127.0.0.1:5432/jyxia_test
          JYXIA_MIGRATION_DATABASE_URL: postgresql+psycopg://jyxia:jyxia_ci_ephemeral_pw@127.0.0.1:5432/jyxia_test
          JYXIA_E2E_REPORT_FILE: /tmp/jyxia_inst_e2e_report.json
        run: |
          set -o pipefail
          /tmp/jyxia-ci-venv/bin/python tools/serve_institutional_e2e_harness.py --self-test-fail-closed
          /tmp/jyxia-ci-venv/bin/python tools/serve_institutional_e2e_harness.py --self-test-process-shutdown
          if ! node tests/e2e/test_institutional_e2e.mjs 2>&1 | tee /tmp/inst_e2e.log; then
            python3 -c "
          from pathlib import Path
          lines = [l.strip() for l in Path('/tmp/inst_e2e.log').read_text(errors='replace').splitlines() if l.strip()]
          print('::error::' + ' | '.join(lines[:6]))
          " || true
            exit 1
          fi
          /tmp/jyxia-ci-venv/bin/python tools/serve_institutional_e2e_harness.py --verify-report /tmp/jyxia_inst_e2e_report.json
      - name: Parar container Keycloak efemero
        if: always()
        run: docker rm -f jyxia-keycloak-ci || true
      - name: Construir imagem Docker institucional e validar assets/rotas em container descartavel
        run: |
          docker build -f backend/Dockerfile -t jyxia-institutional:ci .
          docker run --rm --entrypoint sh jyxia-institutional:ci -eu -c '
            for req in \
              /app/frontend/institutional/index.html \
              /app/frontend/institutional/institutional.css \
              /app/frontend/institutional/institutional-core.mjs \
              /app/frontend/institutional/institutional-ui.mjs \
              /app/frontend/public/vendor/pdf.min.mjs \
              /app/frontend/public/vendor/pdf.worker.min.mjs \
              /app/frontend/public/vendor/PDFJS-LICENSE.txt \
              /app/frontend/public/assets/favicon.svg; do
              test -f "$req" || { echo "MISSING_REQUIRED_FILE: $req"; exit 1; }
            done
            for forbidden in \
              /app/.env \
              /app/.env.example \
              /app/frontend/lab \
              /app/frontend/public/fixtures \
              /app/legacy \
              /app/tests \
              /app/docs \
              /app/tools \
              /app/.git; do
              test ! -e "$forbidden" || { echo "FORBIDDEN_PATH_PRESENT: $forbidden"; exit 1; }
            done
            echo "DOCKER_IMAGE_FILES_AND_ISOLATION_OK: 8/8 required present, 9/9 forbidden absent"
          '
          docker run --rm --entrypoint python -e JYXIA_ENV=test jyxia-institutional:ci -c '
          import subprocess, time, urllib.error, urllib.request
          proc = subprocess.Popen(
              ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"],
              cwd="/app/backend",
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              deadline = time.monotonic() + 20.0
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/live", timeout=2) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      if proc.poll() is not None:
                          out = proc.stdout.read() if proc.stdout else ""
                          raise RuntimeError(f"Uvicorn exited early ({proc.returncode}): {out}")
                      time.sleep(0.25)
              else:
                  raise RuntimeError("Timeout waiting for in-container uvicorn /api/v1/health/live")

              for path in (
                  "/institutional/",
                  "/institutional/index.html",
                  "/institutional/institutional.css",
                  "/institutional/institutional-core.mjs",
                  "/institutional/institutional-ui.mjs",
                  "/institutional/assets/favicon.svg",
                  "/institutional/vendor/pdf.min.mjs",
                  "/institutional/vendor/pdf.worker.min.mjs",
                  "/institutional/vendor/PDFJS-LICENSE.txt",
              ):
                  with urllib.request.urlopen(f"http://127.0.0.1:8000{path}", timeout=5) as resp:
                      assert resp.status == 200, f"{path} -> {resp.status}"
                      cc = resp.headers.get("Cache-Control", "")
                      xcto = resp.headers.get("X-Content-Type-Options", "")
                      csp = resp.headers.get("Content-Security-Policy", "")
                      assert "no-store" in cc, f"Missing no-store on {path}: {cc}"
                      assert xcto == "nosniff", f"Missing nosniff on {path}: {xcto}"
                      assert "script-src \x27self\x27" in csp, f"Missing CSP on {path}: {csp}"
                      body = resp.read()
                      assert len(body) > 0, f"Empty body for {path}"

              for blocked in (
                  "/institutional/../backend/alembic.ini",
                  "/institutional/nonexistent.mjs",
              ):
                  try:
                      urllib.request.urlopen(f"http://127.0.0.1:8000{blocked}", timeout=5)
                      raise AssertionError(f"Expected 404 for {blocked}")
                  except urllib.error.HTTPError as err:
                      assert err.code == 404, f"Expected 404 for {blocked}, got {err.code}"
              print("DOCKER_CONTAINER_HTTP_ROUTES_OK: 9/9 allowlisted 200 OK, 2/2 blocked 404")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except Exception:
                  proc.kill()
          '
      - name: Remover imagem Docker temporaria de CI
        if: always()
        run: docker rmi -f jyxia-institutional:ci || true
