name: Verificacoes de seguranca, demonstracao e backend institucional
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Nucleo documental, laboratorio, benchmark, PDF.js e testes historicos
        run: node --test tests/frontend/test_documental.mjs tests/frontend/test_documental_pdfjs.mjs tests/frontend/test_lab_and_benchmark.mjs tests/legacy/test_security.cjs tests/legacy/test_synthetic_import.cjs
      - name: Integracao historica com identidades sinteticas
        run: python3 -m unittest discover -s tests/legacy -v
      - name: Higiene basica da publicacao e coerencia de dependencias
        run: |
          python3 tools/check_publication.py
          python3 tools/sync_backend_deps.py --check

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jyxia
          POSTGRES_PASSWORD: jyxia_ci_ephemeral_pw
          POSTGRES_DB: jyxia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar fonte unica de dependencias e auditar vulnerabilidades
        run: |
          python3 tools/sync_backend_deps.py --check
          python3 -m venv /tmp/jyxia-ci-venv
          /tmp/jyxia-ci-venv/bin/pip install --no-cache-dir -r backend/requirements-dev.txt
          /tmp/jyxia-ci-venv/bin/pip-audit
      - name: Verificar ciclo completo e incremental Alembic em PostgreSQL 16
        env:
          JYXIA_DATABASE_URL: postgresql+psycopg://jyxia:jyxia_ci_ephemeral_pw@127.0.0.1:5432/jyxia_test
        run: |
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini upgrade head
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade 20261120_0001
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini downgrade base
          /tmp/jyxia-ci-venv/bin/alembic -c backend/alembic.ini upgrade head
      - name: Executar suite Pytest completa contra PostgreSQL 16 real
        env:
          JYXIA_TEST_DATABASE_URL: postgresql+psycopg://jyxia:jyxia_ci_ephemeral_pw@127.0.0.1:5432/jyxia_test
        run: /tmp/jyxia-ci-venv/bin/pytest tests/backend -v
