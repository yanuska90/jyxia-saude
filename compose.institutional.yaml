services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jyxia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SYNTHETIC_LOCAL_ONLY_CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-jyxia_institutional}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jyxia_pgdata:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jyxia} -d ${POSTGRES_DB:-jyxia_institutional}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JYXIA_APP_NAME: ${JYXIA_APP_NAME:-JYXIA Institutional Foundation}
      JYXIA_ENV: ${JYXIA_ENV:-development}
      JYXIA_LOG_LEVEL: ${JYXIA_LOG_LEVEL:-INFO}
      JYXIA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jyxia}:${POSTGRES_PASSWORD:-SYNTHETIC_LOCAL_ONLY_CHANGE_ME}@postgres:5432/${POSTGRES_DB:-jyxia_institutional}
      JYXIA_STORAGE_ROOT: /var/lib/jyxia/synthetic_storage
      JYXIA_ALLOW_LOCAL_SYNTHETIC_STORAGE: "true"
      JYXIA_MAX_DOCUMENT_BYTES: ${JYXIA_MAX_DOCUMENT_BYTES:-10485760}
      JYXIA_OIDC_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jyxia_synthetic_storage:/var/lib/jyxia/synthetic_storage
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:size=32m,noexec,nosuid"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  jyxia_pgdata:
  jyxia_synthetic_storage:
