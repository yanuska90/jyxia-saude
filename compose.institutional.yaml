services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jyxia_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SYNTHETIC_LOCAL_ONLY_CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-jyxia_institutional}
      JYXIA_APP_DB_PASSWORD: ${JYXIA_APP_DB_PASSWORD:-SYNTHETIC_APP_ROLE_LOCAL_CHANGE_ME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jyxia_pgdata:/var/lib/postgresql/data
      - ./backend/infra/postgres_init_roles.sql:/opt/jyxia/postgres_init_roles.sql:ro
      - ./backend/infra/postgres_init_roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jyxia_migrator} -d ${POSTGRES_DB:-jyxia_institutional}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-jyxia_dev_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-SYNTHETIC_KC_ADMIN_CHANGE_ME}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/keycloak/jyxia-dev-realm.json:/opt/keycloak/data/import/jyxia-dev-realm.json:ro
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      JYXIA_APP_NAME: ${JYXIA_APP_NAME:-JYXIA Institutional Foundation}
      JYXIA_ENV: ${JYXIA_ENV:-development}
      JYXIA_DEBUG: "false"
      JYXIA_LOG_LEVEL: ${JYXIA_LOG_LEVEL:-INFO}
      JYXIA_DATABASE_URL: postgresql+psycopg://jyxia_app:${JYXIA_APP_DB_PASSWORD:-SYNTHETIC_APP_ROLE_LOCAL_CHANGE_ME}@postgres:5432/${POSTGRES_DB:-jyxia_institutional}
      JYXIA_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jyxia_migrator}:${POSTGRES_PASSWORD:-SYNTHETIC_LOCAL_ONLY_CHANGE_ME}@postgres:5432/${POSTGRES_DB:-jyxia_institutional}
      JYXIA_STORAGE_ROOT: /var/lib/jyxia/synthetic_storage
      JYXIA_ALLOW_LOCAL_SYNTHETIC_STORAGE: "true"
      JYXIA_MAX_DOCUMENT_BYTES: ${JYXIA_MAX_DOCUMENT_BYTES:-10485760}
      JYXIA_APP_BASE_URL: ${JYXIA_APP_BASE_URL:-http://127.0.0.1:8000}
      JYXIA_OIDC_ENABLED: ${JYXIA_OIDC_ENABLED:-true}
      JYXIA_OIDC_ALLOW_HTTP_DEV: ${JYXIA_OIDC_ALLOW_HTTP_DEV:-true}
      JYXIA_OIDC_ISSUER: ${JYXIA_OIDC_ISSUER:-http://keycloak:8080/realms/jyxia-dev}
      JYXIA_OIDC_CLIENT_ID: ${JYXIA_OIDC_CLIENT_ID:-jyxia-backend-dev}
      JYXIA_OIDC_CLIENT_SECRET: ${JYXIA_OIDC_CLIENT_SECRET:-SYNTHETIC_DEV_KEYCLOAK_SECRET_CHANGE_ME}
      JYXIA_OIDC_REDIRECT_URI: ${JYXIA_OIDC_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/auth/callback}
      JYXIA_OIDC_POST_LOGOUT_REDIRECT_URI: ${JYXIA_OIDC_POST_LOGOUT_REDIRECT_URI:-http://127.0.0.1:8000/}
      JYXIA_OIDC_MFA_REQUIRED: "true"
      JYXIA_OIDC_REQUIRE_BOTH_ACR_AND_AMR: "true"
      JYXIA_OIDC_ALLOWED_ACR: ${JYXIA_OIDC_ALLOWED_ACR:-urn:jyxia:loa:mfa}
      JYXIA_OIDC_ALLOWED_AMR: ${JYXIA_OIDC_ALLOWED_AMR:-otp,totp,hwk,fido,webauthn,mfa}
      JYXIA_OIDC_MAX_AUTH_AGE_SECONDS: ${JYXIA_OIDC_MAX_AUTH_AGE_SECONDS:-3600}
      JYXIA_SESSION_SECRET: ${JYXIA_SESSION_SECRET:-SYNTHETIC_DEV_SESSION_SECRET_32_CHARS_MIN_CHANGE_ME}
      JYXIA_CSRF_SECRET: ${JYXIA_CSRF_SECRET:-SYNTHETIC_DEV_CSRF_SECRET_32_CHARS_MIN_CHANGE_ME}
      JYXIA_SESSION_COOKIE_SECURE: ${JYXIA_SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - jyxia_synthetic_storage:/var/lib/jyxia/synthetic_storage
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 64
    mem_limit: 512m
    tmpfs:
      - "/tmp:size=32m,noexec,nosuid"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  jyxia_pgdata:
  jyxia_synthetic_storage:
