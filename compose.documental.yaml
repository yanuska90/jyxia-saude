services:
  documental:
    build:
      context: .
      dockerfile: Dockerfile.documental
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/demo.html',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
