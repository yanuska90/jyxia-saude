services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: jyxia_dev
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Defina MONGO_PASSWORD no arquivo .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://jyxia_dev:${MONGO_PASSWORD:?Defina MONGO_PASSWORD}@mongo:27017/?authSource=admin
      JYXIA_API_TOKEN: ${JYXIA_API_TOKEN:?Defina JYXIA_API_TOKEN com ao menos 32 caracteres}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  mongo_data:
